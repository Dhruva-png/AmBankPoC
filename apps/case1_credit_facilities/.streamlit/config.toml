chartCategoricalColors = ["#2451D6", "#146C3A", "#91600A", "#B3261E", "#64748b", "#7C3AED", "#0284c7"]

[theme.sidebar]
backgroundColor = "#101728"
secondaryBackgroundColor = "#182238"
