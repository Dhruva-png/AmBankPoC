primaryColor = "#2451D6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#101828"
borderColor = "#e1e5ea"
linkColor = "#2451D6"
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
font = "'Segoe UI', Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Segoe UI', Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"

greenColor = "#16a34a"
